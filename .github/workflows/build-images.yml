name: Build and Push Container Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Prepare image name
        id: image-name
        run: |
          # Convert repository name to lowercase for GHCR compatibility
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "value=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Image name: ${IMAGE_NAME}"
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove large packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=w2t-bkin
            org.opencontainers.image.description=W2T Body Kinematics Pipeline - Worker container

      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          platforms: linux/amd64
          # Temporarily disabled arm64 due to disk space constraints
          # platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-worker'

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  test-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Prepare image name
        id: image-name
        run: |
          # Convert repository name to lowercase for GHCR compatibility
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "value=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Image name: ${IMAGE_NAME}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull worker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ github.ref_name }}

      - name: Test worker image - CLI
        run: |
          # Test that CLI is available
          docker run --rm ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ github.ref_name }} python -m w2t_bkin.cli --version

      - name: Test worker image - Dependencies
        run: |
          # Test Prefect
          docker run --rm ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ github.ref_name }} python -c "import prefect; print(f'Prefect version: {prefect.__version__}')"
          # Test ffmpeg
          docker run --rm ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ github.ref_name }} ffmpeg -version

      - name: Test image size
        run: |
          WORKER_SIZE=$(docker image inspect ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ github.ref_name }} --format='{{.Size}}' | awk '{print $1/1024/1024/1024}')
          echo "Worker image size: ${WORKER_SIZE} GB"
          # Warn if over 3GB (worker has ML dependencies)
          if (( $(echo "$WORKER_SIZE > 3" | bc -l) )); then
            echo "::warning::Worker image exceeds 3GB"
          fi
