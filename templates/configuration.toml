# =============================================================================
# Synchronization Strategy
# =============================================================================

[synchronization]
strategy = "hardware_pulse"
reference_channel = "ttl_camera"

[synchronization.alignment]
method = "nearest"
tolerance_s = 0.002
global_offset_s = 0.0

# =============================================================================
# Verification & Validation
# Session logs auto-created: {output_root}/{subject}/{session}/pipeline.log
# =============================================================================

[verification]
enabled = true                # Master switch
check_frame_counts = true     # Count frames via ffprobe (slow)
check_sync_mismatch = true    # Verify frame/TTL sync (false = skip TTL checks)
mismatch_tolerance_frames = 0 # Max allowed frame/pulse difference
warn_on_mismatch = false      # Warn instead of fail

# =============================================================================
# Preprocessing Configuration
# =============================================================================

[preprocessing]
force_rerun = false # Regenerate all intermediate files

[preprocessing.dlc]
enabled = true
# gpu = 0                               # GPU index (omit for auto-detect)

[preprocessing.sleap]
enabled = false
# gpu = 0                               # GPU index (omit for auto-detect)

# =============================================================================
# Logging Configuration
# =============================================================================

[logging]
level = "INFO"     # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false # Use JSON format
