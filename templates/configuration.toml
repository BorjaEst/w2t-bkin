[project]
name = "w2t-bkin-pipeline"

[paths]
raw_root = "data/raw"  # Points to real test data with Session-000001
intermediate_root = "data/interim"  # Intermediate processing outputs
output_root = "data/processed"      # Output data root
metadata_file = "metadata.toml"      # Session metadata file name within each session directory
models_root = "models"              # Directory containing pose estimation models

# Hardware sync policy: software does not compute per-frame timestamps; it verifies counts
[verification]
mismatch_tolerance_frames = 0       # abort if video_frame_count - ttl_pulse_count > tolerance
warn_on_mismatch = false            # when true, warn instead of abort if within tolerance

# Trial synchronization configuration for aligning Bpod to TTL timeline
# Maps Bpod trial types to sync signals and TTL channels
[[bpod.sync.trial_types]]
trial_type = 1
description = "Active whisker touch trials"
sync_signal = "W2T_Audio"          # Bpod state that triggers TTL
sync_ttl = "ttl_cue"               # TTL channel ID (must match [[TTLs]].id in session)

[[bpod.sync.trial_types]]
trial_type = 2
description = "Passive whisker touch trials"
sync_signal = "A2L_Audio"
sync_ttl = "ttl_cue"

[[bpod.sync.trial_types]]
trial_type = 3
description = "Microstim trials"
sync_signal = "Microstim"
sync_ttl = "ttl_cue"

# Global video defaults (legacy fallback; generally superseded by per-camera probing)
[video.transcode]
enabled = true
codec = "h264"                      # ffmpeg codec name
crf = 20                            # quality factor (0-51)
preset = "fast"                     # ffmpeg preset
keyint = 15                         # GOP length

# Logging defaults
[logging]
level = "INFO"              # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false          # whether to use structured (e.g., JSON) logging

