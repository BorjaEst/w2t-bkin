# =============================================================================
# Synchronization Strategy
# =============================================================================

[synchronization]
strategy = "hardware_pulse"
reference_channel = "ttl_camera"

[synchronization.alignment]
method = "nearest"
tolerance_s = 0.002
global_offset_s = 0.0

# =============================================================================
# Verification & Validation
# Session logs auto-created: {output_root}/{subject}/{session}/pipeline.log
# =============================================================================

[verification]
enabled = true                # Master switch
check_frame_counts = true     # Count frames via ffprobe (slow)
check_sync_mismatch = true    # Verify frame/TTL sync (false = skip TTL checks)
mismatch_tolerance_frames = 0 # Max allowed frame/pulse difference
warn_on_mismatch = false      # Warn instead of fail

# =============================================================================
# Preprocessing Configuration
# =============================================================================

[preprocessing]
force_rerun = false # Regenerate all intermediate files (applies to 'generate' mode only)

# -----------------------------------------------------------------------------
# DeepLabCut Pose Estimation
# -----------------------------------------------------------------------------
[preprocessing.dlc]
enabled = true
mode = "auto"  # off | discover | generate | auto
               # - off: Skip DLC entirely
               # - discover: Use pre-existing H5 files (camera/model mapping in metadata.pose)
               # - generate: Run DLC inference (requires metadata.pose.cameras + metadata.pose.models)
               # - auto: Generate if metadata defines models, otherwise discover
               #
               # Model selection is now per-camera in metadata.toml:
               # [pose.cameras.<camera_id>]
               # model_id = "<model_id>"  # References pose.models.<model_id>.path

# gpu = 0                               # GPU index (omit for auto-detect, -1 for CPU)
# save_csv = false                      # Export CSV in addition to H5

# -----------------------------------------------------------------------------
# SLEAP Pose Estimation
# -----------------------------------------------------------------------------
[preprocessing.sleap]
enabled = false
mode = "auto"  # off | discover | auto (generate NOT IMPLEMENTED)
               # - off: Skip SLEAP entirely
               # - discover: Use pre-existing H5 files (camera/model mapping in metadata.pose)
               # - auto: Same as discover when enabled
               #
               # Model selection is per-camera in metadata.toml (same as DLC)

# gpu = 0                               # GPU index (omit for auto-detect, -1 for CPU)

# =============================================================================
# Logging Configuration
# =============================================================================

[logging]
level = "INFO"     # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false # Use JSON format
