# =============================================================================
# Discovery (Raw data loading, validation, etc.)
# Session logs auto-created: {output_root}/{subject}/{session}/pipeline.log
# =============================================================================

[discovery]

# TTLs configuration
ttl_signals.enable_loading = true    # Enable discovery of TTL signal files

# Cameras configuration
cameras.enable_loading = true  # Enable discovery of camera video files
cameras.ttl_validation = false      # Verify frame/TTL sync (false = skip TTL checks)
cameras.ttl_tolerance = 0       # Max allowed frame/pulse difference
cameras.mismatch_warn_only = false   # Warn instead of fail

# Bpod configuration
bpod.enable_loading = true     # Enable discovery of Bpod behavioral files
bpod.continuous_time = true    # Use continuous time for Bpod events

# =============================================================================
# Artifacts (Pose and any interim data generation)
# =============================================================================

[artifacts.dlc]
mode = "auto"  # off | discover | generate | auto
# gpu = 0        # GPU index (omit for auto-detect, -1 for CPU)
# save_csv = true   # Save DLC CSV outputs alongside H5 files
               

# =============================================================================
# Synchronization Strategy
# =============================================================================

[synchronization]
strategy = "hardware_pulse"
reference_channel = "ttl_camera"

[synchronization.alignment]
method = "nearest"
tolerance_s = 0.002
global_offset_s = 0.0



                # GPU index (omit for auto-detect, -1 for CPU)

# =============================================================================
# Logging Configuration
# =============================================================================

[logging]
level = "INFO"     # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false # Use JSON format
