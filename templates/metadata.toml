# NWB Session Configuration File
# Based on pynwb.file.NWBFile specification
# Documentation: https://pynwb.readthedocs.io/en/stable/pynwb.file.html#pynwb.file.NWBFile

# =============================================================================
# OPTIONAL METADATA FIELDS
# =============================================================================

# Lab-specific ID for the session
session_id = "000001"

# Name of person(s) who performed experiment (can be a list)
experimenter = ["Esteban, Borja", "Python, Code"]

# General description of the experiment
experiment_description = """
Water-to-target behavioral task with simultaneous video tracking.
Animal navigates to target location while pose is tracked using
DeepLabCut and synchronized with Bpod behavioral events.
"""

# Institution(s) where experiment is performed
institution = "Neural Dynamics Laboratory, University Example"

# Lab where experiment was performed
lab = "Larkum Lab"

# Terms to search over (keywords)
keywords = [
    "behavior",
    "pose tracking",
    "synchronization",
    "water reward",
    "navigation",
]

# Notes about the experiment
notes = """
Session conducted with standard lighting conditions.
Animal showed normal behavior throughout the session.
All equipment functioning properly.
"""

# Experimental protocol reference (e.g., IACUC protocol number)
protocol = "IACUC-2025-001"

# Publication information (PMID, DOI, URL, etc.)
related_publications = []

# Description of drugs used, including administration details
pharmacology = "None"

# Description of slices (for in vitro experiments)
slices = "N/A - in vivo experiment"

# Notes about data collection and analysis
data_collection = """
Data collected using Bpod behavioral control system.
Video recorded at 30 fps using synchronized cameras.
Pose estimated using DeepLabCut model trained on lab-specific data.
"""

# Narrative description about surgery/surgeries
surgery = """
Cranial window implant surgery performed 2 weeks prior to recording.
No complications observed. Animal recovered fully.
"""

# Information about virus(es) used
virus = "None"

# Notes about stimuli presentation
stimulus_notes = "Visual target displayed on LED screen at variable locations"

# Date and time corresponding to time zero of all timestamps
# If not specified, defaults to session_start_time
# timestamps_reference_time = "2025-01-15T14:30:00"

# =============================================================================
# DEVICES
# =============================================================================

# Devices used in the experiment
[[devices]]
name = "bpod"
description = "Bpod State Machine r2.5 for behavioral control"
manufacturer = "Sanworks"

[[devices]]
name = "camera_0"
description = "High-speed camera for pose tracking - overhead view"
manufacturer = "FLIR"
model_name = "Blackfly S"

[[devices]]
name = "camera_1"
description = "High-speed camera for pose tracking - side view"
manufacturer = "FLIR"
model_name = "Blackfly S"

# =============================================================================
# ELECTRODE GROUPS (for electrophysiology, if applicable)
# =============================================================================

# Example electrode group (remove if not applicable)
[[electrode_groups]]
name = "tetrode1"
description = "Tetrode in motor cortex"
location = "M1, right hemisphere"
device = "neuropixels"

# =============================================================================
# IMAGING PLANES (for optical imaging, if applicable)
# =============================================================================

# Example imaging plane (remove if not applicable)
[[imaging_planes]]
name = "imaging_plane_1"
description = "Imaging plane in primary motor cortex"
excitation_lambda = 920.0
indicator = "GCaMP6f"
location = "M1"
device = "two_photon_microscope"
imaging_rate = 30.0

# =============================================================================
# OPTOGENETIC SITES (if applicable)
# =============================================================================

# Example optogenetic site (remove if not applicable)
[[ogen_sites]]
name = "stim_site_1"
description = "Optogenetic stimulation site in M1"
excitation_lambda = 473.0
location = "M1, left hemisphere"
device = "laser_473"

# =============================================================================
# PROCESSING MODULES
# =============================================================================

# Processing modules for organizing processed data
[[processing_modules]]
name = "behavior"
description = "Processed behavioral data including pose estimates and synchronized events"

[[processing_modules]]
name = "sync"
description = "Synchronization data between Bpod and cameras"

# =============================================================================
# POSE ESTIMATION CONFIGURATION
# =============================================================================
# This section defines per-camera pose estimation models and optional
# skeleton/mapping configurations for harmonization and assembly.
#
# Structure:
#   - pose.models: Define reusable pose models (DLC/SLEAP)
#   - pose.cameras: Associate each camera with a model and optional configs
#   - pose.mappings: (Optional) Keypoint name harmonization rules
#   - pose.skeletons: (Optional) Skeleton definitions with edges
#
# Note: Models are referenced by model_id, allowing hierarchical overrides
# (global → subject → session) via recursive dict merge.

# -----------------------------------------------------------------------------
# Pose Models (DLC/SLEAP model definitions)
# -----------------------------------------------------------------------------
[pose.models]
  # Example DLC model for camera 0 (overhead view)
  [pose.models.dlc_cam0]
  source = "dlc"  # "dlc" or "sleap"
  path = "iteration-1/BA_W2T_cam0.newOct30-trainset95shuffle1/config.yaml"  # Relative to paths.models_root
  # description = "DLC model trained on overhead view, 95% training set"

  # Example DLC model for camera 1 (side view)
  [pose.models.dlc_cam1]
  source = "dlc"
  path = "iteration-1/BA_W2T_cam1.sideview-trainset95shuffle1/config.yaml"
  # description = "DLC model trained on side view"

  # Example SLEAP model (if using SLEAP)
  # [pose.models.sleap_cam0]
  # source = "sleap"
  # path = "sleap_models/cam0_model.h5"

# -----------------------------------------------------------------------------
# Camera-Model Associations
# -----------------------------------------------------------------------------
[pose.cameras]
  # Camera 0: overhead view with DLC
  [pose.cameras.camera_0]
  source = "dlc"           # Must match pose.models.<model_id>.source
  model_id = "dlc_cam0"    # References pose.models.dlc_cam0
  # mapping_id = "dlc_to_canonical"  # Optional: keypoint name harmonization
  # skeleton_id = "rat_skeleton"     # Optional: skeleton definition for this camera

  # Camera 1: side view with DLC
  [pose.cameras.camera_1]
  source = "dlc"
  model_id = "dlc_cam1"
  # mapping_id = "dlc_to_canonical"
  # skeleton_id = "rat_skeleton"

# -----------------------------------------------------------------------------
# Keypoint Mappings (Optional: harmonize names across models/sources)
# -----------------------------------------------------------------------------
[pose.mappings]
  # Example: map DLC-specific keypoint names to canonical skeleton
  # [pose.mappings.dlc_to_canonical]
  # snout = "nose"
  # ear_left = "ear_l"
  # ear_right = "ear_r"
  # spine_base = "spine1"

# -----------------------------------------------------------------------------
# Skeleton Definitions (Optional: define edges for visualization)
# -----------------------------------------------------------------------------
[pose.skeletons]
  # Example skeleton with edges
  # [pose.skeletons.rat_skeleton]
  # name = "Rat body skeleton"
  # nodes = ["nose", "ear_l", "ear_r", "spine1", "spine2", "spine3", "tail_base", "tail_mid", "tail_tip"]
  # # Edges as [node_index_1, node_index_2] pairs (0-indexed into nodes list)
  # edges = [[0, 1], [0, 2], [0, 3], [3, 4], [4, 5], [5, 6], [6, 7], [7, 8]]

# =============================================================================
# PIPELINE SOURCE DEFINITIONS (Not NWB Metadata)
# =============================================================================

[bpod]
path = "Bpod/*.mat"
order = "time_asc"
continuous_time = false

# Bpod-TTL synchronization configuration
# Maps each trial type to its sync signal and TTL channel
[[bpod.sync.trial_types]]
trial_type = 1            # Trial type ID (from Bpod)
sync_signal = "W2T_Audio" # Bpod state/event name that triggers sync TTL
sync_ttl = "ttl_cue"      # TTL channel ID (must match [[TTLs]].id below)

[[bpod.sync.trial_types]]
trial_type = 2
sync_signal = "A2L_Audio"
sync_ttl = "ttl_cue"

# Camera configurations
# Each camera used in the experiment 
[[cameras]]
id = "camera_0"
paths = "Video/top/*.avi"
fps = 30.0
ttl_id = "ttl_camera"

[[cameras]]
id = "camera_1"
paths = "Video/pupil_left/*.avi"
fps = 30.0
ttl_id = "ttl_camera"

# TTL synchronization channels
[[TTLs]]
id = "ttl_camera"
paths = "TTLs/*_frame.txt"
description = "Camera exposure pulses (frame sync)"

[[TTLs]]
id = "ttl_cue"
paths = "TTLs/*_cue.txt"
description = "Audio cue onset pulses"

[[TTLs]]
id = "ttl_hitmiss"
paths = "TTLs/*_hitmiss.txt"
description = "Trial outcome signals"

# =============================================================================
# POSE DATA CONFIGURATION
# =============================================================================

# Pose estimation source files and configuration
# Use this section when mode='discover' to specify which H5 files to use

# Camera-specific pose data sources
# Each entry maps a camera_id to its pose H5 file
[[pose.cameras]]
camera_id = "camera_0"             # Must match [[cameras]].id
source = "dlc"                     # dlc | sleap
h5_path = "dlc-pose/camera_0.h5"  # Relative to intermediate_root/session_id/
mapping_id = "canonical_mouse"     # Optional: reference to [[pose.mappings]]
skeleton_id = "mouse_bodyparts"    # Optional: reference to [[pose.skeletons]]

[[pose.cameras]]
camera_id = "camera_1"
source = "dlc"
h5_path = "dlc-pose/camera_1.h5"
mapping_id = "canonical_mouse"
skeleton_id = "mouse_bodyparts"

# Body part name mappings (harmonization to canonical names)
# Used by harmonize_to_canonical() to standardize bodypart names
[[pose.mappings]]
id = "canonical_mouse"
description = "DLC model-specific to canonical mouse bodypart names"

[pose.mappings.map]
# DLC name → canonical name
nose = "snout"
leftear = "ear_left"
rightear = "ear_right"
bodycentre = "body_center"
tailbase = "tail_base"
tailend = "tail_tip"

# Skeleton definitions (nodes and edges for visualization)
# Edges are optional; if not provided, auto-derived from H5 bodyparts
[[pose.skeletons]]
id = "mouse_bodyparts"
name = "Mouse Full Body"
description = "Standard mouse skeleton with head, body, and tail"

[[pose.skeletons.nodes]]
name = "snout"
[[pose.skeletons.nodes]]
name = "ear_left"
[[pose.skeletons.nodes]]
name = "ear_right"
[[pose.skeletons.nodes]]
name = "body_center"
[[pose.skeletons.nodes]]
name = "tail_base"
[[pose.skeletons.nodes]]
name = "tail_tip"

[[pose.skeletons.edges]]
source = "snout"
target = "body_center"

[[pose.skeletons.edges]]
source = "body_center"
target = "tail_base"

[[pose.skeletons.edges]]
source = "tail_base"
target = "tail_tip"

[[pose.skeletons.edges]]
source = "ear_left"
target = "body_center"

[[pose.skeletons.edges]]
source = "ear_right"
target = "body_center"
