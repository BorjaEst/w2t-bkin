# =============================================================================
# NWB Session Metadata (Session-Specific)
# =============================================================================

# --- Required Fields ---

session_description = "Behavioral training session with pose tracking and camera synchronization"
identifier = "Session-000001"         # Unique file identifier
session_start_time = "2025-01-15T14:30:00Z"  # ISO 8601: YYYY-MM-DDTHH:MM:SS

# --- Subject Information (if not defined in parent metadata) ---

[subject]
subject_id = "M001"
age = "P84D"                           # ISO 8601 Duration
sex = "M"
species = "Mus musculus"

# =============================================================================
# Pipeline Source Configuration (Session-Specific Overrides)
# See docs/configuration-parameters.md for details
# =============================================================================

# Camera Configuration
# Inherits from parent metadata but can override per session

[[cameras]]
id = "camera_0"
paths = "Video/cam0_*.avi"
order = "name_asc"
fps = 150.0
ttl_id = "ttl_camera"
optional = false                   # Pipeline fails if missing

[[cameras]]
id = "camera_1"
paths = "Video/cam1_*.avi"
order = "name_asc"
fps = 150.0
ttl_id = "ttl_camera"
optional = true                    # Pipeline continues if missing

# TTL Channels

[[TTLs]]
id = "ttl_camera"
paths = "TTLs/*_frame.txt"
description = "Camera exposure pulses"

[[TTLs]]
id = "ttl_cue"
paths = "TTLs/*_cue.txt"
description = "Behavioral cue signals"
