[paths]
raw_root = "tests/fixtures/data/raw"
intermediate_root = "data/interim"
output_root = "data/processed"
models_root = "models"

[synchronization]
strategy = "hardware_pulse"          # Options: rate_based | hardware_pulse | network_stream
reference_channel = "ttl_camera"      # Master clock TTL channel

[synchronization.alignment]
method = "nearest"                    # Options: nearest | linear
tolerance_s = 0.010                   # Max allowed timing jitter (seconds)
global_offset_s = 0.0                 # Global time offset correction

[acquisition]
concat_strategy = "ffconcat"          # ffmpeg concat demuxer

[verification]
enabled = true                        # Master switch
check_frame_counts = true             # Count frames via ffprobe
check_sync_mismatch = true            # Verify frame/TTL sync (false = skip TTL checks)
skip_nwb_requirements = false         # Use FPS estimates (not recommended)
mismatch_tolerance_frames = 0         # Max allowed frame/pulse difference
warn_on_mismatch = false              # Warn instead of fail

[bpod]
parse = true

# Global video defaults (legacy fallback; generally superseded by per-camera probing)
[video.transcode]
enabled = true
codec = "h264"                      # ffmpeg codec name
crf = 20                            # quality factor (0-51)
preset = "fast"                     # ffmpeg preset
keyint = 15                         # GOP length

# NWB export templates (session supplies concrete file_name/session_description or we expand these)
[nwb]
link_external_video = true
lab = "Lab Name"
institution = "Institution Name"
file_name_template = "{session.id}.nwb"
session_description_template = "Session {session.id} on {session.date}"

# QC report output (template expands if session provides no explicit override)
[qc]
generate_report = true
out_template = "qc/{session.id}"    # output path template for QC report
include_verification = true         # include frame/TTL counts and mismatches in report

# Logging defaults
[logging]
level = "INFO"              # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false          # whether to use structured (e.g., JSON) logging
