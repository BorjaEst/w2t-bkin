# --- Bpod Configuration ---

[bpod]
path = "Bpod/*.mat"
order = "name_asc"
continuous_time = false

[[bpod.trial_types]]
description = "Active whisker touch trials"
trial_type = 1
sync_signal = "W2T_Audio"
sync_ttl = "ttl_cue"

[[bpod.trial_types]]
description = "Passive whisker touch trials"
trial_type = 2
sync_signal = "A2L_Audio"
sync_ttl = "ttl_cue"

[[bpod.trial_types]]
description = "Microstim trials"
trial_type = 3
sync_signal = "Microstim"
sync_ttl = "ttl_cue"

# --- TTL Channels ---

[[TTLs]]
id = "ttl_hitmiss"
description = "Hit/Miss signal from behavior"
paths = "TTLs/*nidq.xa_1_0*.txt"

[[TTLs]]
id = "ttl_camera"
description = "Camera sync pulses"
paths = "TTLs/*nidq.xa_7_0*.txt"

[[TTLs]]
id = "ttl_cue"
description = "Cue signal from behavior"
paths = "TTLs/*nidq.xia_3_0*.txt"

# --- Camera Configuration ---

[[cameras]]
id = "cam0"
description = "Top-down camera view of mouse"
paths = "Video/top/*.avi"
order = "name_asc"
ttl_id = "ttl_camera"
optional = false                      # Required camera

[[cameras]]
id = "cam1"
description = "Left eye pupil camera"
paths = "Video/pupil_left/*.avi"
order = "name_asc"
ttl_id = "ttl_camera"
optional = false                      # Required camera
