# =============================================================================
# Project Configuration
# =============================================================================

[project]
name = "w2t-bkin-pipeline"

[paths]
raw_root = "data/raw"
intermediate_root = "data/interim"
output_root = "data/processed"
models_root = "models"

# =============================================================================
# Synchronization Strategy
# =============================================================================

[synchronization]
strategy = "hardware_pulse"
reference_channel = "ttl_camera"

[synchronization.alignment]
method = "nearest"
tolerance_s = 0.002
global_offset_s = 0.0

# =============================================================================
# Verification & Validation
# Session logs auto-created: {output_root}/{subject}/{session}/pipeline.log
# =============================================================================

[verification]
enabled = true                # Master switch
check_frame_counts = true     # Count frames via ffprobe (slow)
check_sync_mismatch = true    # Verify frame/TTL sync (false = skip TTL checks)
skip_nwb_requirements = false # Use FPS estimates (not recommended)
mismatch_tolerance_frames = 0 # Max allowed frame/pulse difference
warn_on_mismatch = false      # Warn instead of fail

# =============================================================================
# Preprocessing Configuration
# =============================================================================

[preprocessing]
force_rerun = false # Regenerate all intermediate files

[preprocessing.dlc]
enabled = true
# gpu = 0                               # GPU index (omit for auto-detect)

# =============================================================================
# Bpod Trial Synchronization
# =============================================================================

[[bpod.sync.trial_types]]
trial_type = 1
sync_signal = "W2T_Audio" # Bpod state triggering TTL
sync_ttl = "ttl_cue"      # TTL channel (must exist in metadata)

[[bpod.sync.trial_types]]
trial_type = 2
sync_signal = "A2L_Audio"
sync_ttl = "ttl_cue"

[[bpod.sync.trial_types]]
trial_type = 3
sync_signal = "Microstim"
sync_ttl = "ttl_cue"

# =============================================================================
# Logging Configuration
# =============================================================================

[logging]
level = "INFO"     # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false # Use JSON format
