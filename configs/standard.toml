# =============================================================================
# Logging Configuration
# =============================================================================
[logging]

level = "INFO"     # DEBUG | INFO | WARNING | ERROR | CRITICAL
structured = false # Use JSON format

# =============================================================================
# Discovery (Raw data loading, validation, etc.)
# Session logs auto-created: {output_root}/{subject}/{session}/pipeline.log
# =============================================================================
[discovery]

# TTLs configuration
discover_cameras = true     # Enable discovery of camera video files
discover_ttl_signals = true # Enable discovery of TTL signal files
discover_bpod = true        # Enable discovery of Bpod behavioral files
discover_pose = true        # Enable discovery of pose data files
discover_models = true      # Enable discovery of pose estimation models

# =============================================================================
# Artifacts (Pose and any interim data generation)
# Preprocessing steps to generate pose data, etc.
# =============================================================================
[artifacts]

mode = "auto" # off | discover | generate | auto
# gpu = 0        # GPU index (omit for auto-detect, -1 for CPU)

# =============================================================================
# Ingestion Configuration
# What data modalities to load and how and how to validate them
# =============================================================================
[ingestion]

# TTLs configuration
ttl_signals.enable_loading = true # Enable discovery of TTL signal files

# Cameras configuration
video.enable_loading = true      # Enable discovery of camera video files
video.ttl_validation = false     # Verify frame/TTL sync (false = skip TTL checks)
video.ttl_tolerance = 0          # Max allowed frame/pulse difference
video.mismatch_warn_only = false # Warn instead of fail

# Bpod configuration
bpod.enable_loading = true  # Enable discovery of Bpod behavioral files
bpod.continuous_time = true # Use continuous time for Bpod events

# Pose configuration
pose.enable_loading = true # Enable discovery of pose data files
pose.file_type = "h5"      # Preferred pose estimation file type to load (h5 or csv)

# =============================================================================
# Synchronization Strategy
# Which synchronization strategy to use and its parameters
# =============================================================================
[synchronization]

# Strategy and channel
strategy = "hardware_pulse_robust"  # rate_based | hardware_pulse | hardware_pulse_robust | network_stream
reference_channel = "ttl_camera" # Reference channel ID for synchronization

# Alignment method and parameters
alignment_method = "nearest" # nearest | linear
tolerance = 0.002            # Seconds
global_offset = 0.0          # Seconds

# =============================================================================
# Assembly Configuration
# How to assemble different data modalities into NWB
# =============================================================================
[assembly]

ttls.mode = "assemble"     # skip | assemble 
behavior.mode = "assemble" # skip | assemble 
videos.mode = "link"       # skip | link
pose.mode = "assemble"     # skip | assemble

# =============================================================================
# Finalization Configuration
# =============================================================================
[finalization]

qc_report = true       # Generate QC report after NWB creation
alignment_stats = true # Include alignment statistics in the NWB file
provenance = true      # Include data provenance information in NWB
